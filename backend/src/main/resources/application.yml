spring:
  application:
    name: webcollector
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.webcollector: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n'

app:
  auth:
    registration-enabled: false
  capture:
    worker-id: ${CAPTURE_WORKER_ID:capture-worker-local}
    lease-seconds: ${CAPTURE_LEASE_SECONDS:120}
    work-root: ${CAPTURE_WORK_ROOT:./data/capture-work}
    scheduler-enabled: ${CAPTURE_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${CAPTURE_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${CAPTURE_INITIAL_DELAY_MS:10000}
    batch-size: ${CAPTURE_BATCH_SIZE:10}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  token-style: uuid
  is-log: false
